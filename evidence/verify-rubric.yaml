rubrics:
  - id: 1
    type: f2p
    text: 报名事务按参会者与当前可见 TalkSlot 时间范围检查重叠，不只检查目标 submission 的容量。
  - id: 2
    type: f2p
    text: 两个并发请求报名相互重叠场次时最多一条成为 CONFIRMED，锁顺序不会产生永久死锁。
  - id: 3
    type: f2p
    text: 同一报名重复提交返回既有结果，重复取消只释放一次且不会误取消其他场次。
  - id: 4
    type: f2p
    text: WIP 移动、延长或换日导致既有确认报名重叠时，发布检查列出具体参会者和冲突场次。
  - id: 5
    type: f2p
    text: 存在冲突的 WIP 不会成为公开日程，上一发布版本、报名和容量继续完整可用。
  - id: 6
    type: f2p
    text: 取消报名或修正场次后，同一发布操作可重试并只生成一个无冲突的新公开代际。
  - id: 7
    type: p2p
    text: 网页、组织者表格、API、widget 与导出使用同一冲突判定和确认状态，不受缓存顺序影响。
  - id: 8
    type: p2p
    text: 无开始时间、break、无需报名场次、无限容量和无冲突报名的现有行为保持通过。
